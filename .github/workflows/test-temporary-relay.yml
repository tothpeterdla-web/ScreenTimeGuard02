name: Test Temporary Remote Relay

on:
  push:
    branches: [ "feature/remote-parent-unlock" ]
    paths:
      - "remote/**"
      - ".github/workflows/test-temporary-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Create bootstrap Worker config
        shell: bash
        run: |
          cat > remote/wrangler.temp.jsonc <<'EOF'
          {
            "name": "screentimeguard-remote",
            "main": "worker.js",
            "compatibility_date": "2026-10-01"
          }
          EOF

      - name: Bootstrap temporary Cloudflare account
        id: bootstrap
        shell: bash
        working-directory: remote
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/cloudflare-bootstrap.log"
          npx wrangler deploy --temporary --config wrangler.temp.jsonc >"$LOG" 2>&1

          CLAIM_URL=$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' "$LOG" | tail -1 || true)
          test -n "$CLAIM_URL"
          echo "claim_url=$CLAIM_URL" >> "$GITHUB_OUTPUT"

      - name: Create D1 database and explicit binding config
        shell: bash
        working-directory: remote
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/cloudflare-d1-create.log"
          npx wrangler d1 create screentimeguard-remote --temporary \
            --config wrangler.temp.jsonc >"$LOG" 2>&1

          DB_ID=$(sed -nE 's/.*database_id[[:space:]]*=[[:space:]]*"([0-9a-fA-F-]{36})".*/\1/p' "$LOG" | tail -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(grep -Eo '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' "$LOG" | tail -1 || true)
          fi
          test -n "$DB_ID"

          node - "$DB_ID" <<'NODE'
          const fs = require('fs');
          const dbId = process.argv[2];
          const config = {
            name: 'screentimeguard-remote',
            main: 'worker.js',
            compatibility_date: '2026-10-01',
            d1_databases: [{
              binding: 'DB',
              database_name: 'screentimeguard-remote',
              database_id: dbId
            }]
          };
          fs.writeFileSync('wrangler.temp.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Apply D1 schema
        shell: bash
        working-directory: remote
        run: |
          set -euo pipefail
          npx wrangler d1 execute screentimeguard-remote --temporary --remote \
            --file=./schema.sql --yes --config wrangler.temp.jsonc >/dev/null

      - name: Deploy relay with D1 binding
        id: final_deploy
        shell: bash
        working-directory: remote
        env:
          BOOTSTRAP_CLAIM_URL: ${{ steps.bootstrap.outputs.claim_url }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/cloudflare-final-deploy.log"
          npx wrangler deploy --temporary --config wrangler.temp.jsonc >"$LOG" 2>&1

          WORKER_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$LOG" | tail -1 || true)
          FINAL_CLAIM_URL=$(grep -Eo 'https://dash\.cloudflare\.com/claim-preview\?claimToken=[^[:space:]]+' "$LOG" | tail -1 || true)
          test -n "$WORKER_URL"
          if [ -z "$FINAL_CLAIM_URL" ]; then FINAL_CLAIM_URL="$BOOTSTRAP_CLAIM_URL"; fi
          test -n "$FINAL_CLAIM_URL"

          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          {
            echo "WORKER_URL=$WORKER_URL"
            echo "CLAIM_URL=$FINAL_CLAIM_URL"
          } > "$RUNNER_TEMP/cloudflare-claim.txt"

      - name: End-to-end relay smoke test
        shell: bash
        env:
          WORKER_URL: ${{ steps.final_deploy.outputs.worker_url }}
        run: |
          set -euo pipefail

          request() {
            NAME="$1"; shift
            BODY="$RUNNER_TEMP/${NAME}.json"
            CODE=$(curl --silent --show-error -o "$BODY" -w '%{http_code}' "$@")
            echo "$NAME -> HTTP $CODE"
            if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
              cat "$BODY"; echo; exit 1
            fi
          }

          expect_code() {
            EXPECTED="$1"; NAME="$2"; shift 2
            BODY="$RUNNER_TEMP/${NAME}.json"
            CODE=$(curl --silent --show-error -o "$BODY" -w '%{http_code}' "$@")
            echo "$NAME -> HTTP $CODE"
            test "$CODE" = "$EXPECTED"
          }

          ROOT_CODE=$(curl --silent --show-error -o "$RUNNER_TEMP/root.html" -w '%{http_code}' "$WORKER_URL/")
          test "$ROOT_CODE" = "200"
          grep -q "guardian PIN" "$RUNNER_TEMP/root.html"

          DEVICE="test-device-$(openssl rand -hex 8)"
          SECRET=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          PIN="1234"
          PROOF=$(printf 'stg-remote-pin-v1|%s|%s' "$SECRET" "$PIN" | sha256sum | awk '{print $1}')
          WRONG_PROOF=$(printf 'stg-remote-pin-v1|%s|9999' "$SECRET" | sha256sum | awk '{print $1}')
          AUTH="Authorization: Bearer $SECRET"

          request register \
            -X POST "$WORKER_URL/v1/register" \
            -H 'Content-Type: application/json' -H "$AUTH" \
            --data "{\"deviceId\":\"$DEVICE\",\"guardianProof\":\"$PROOF\"}"

          expect_code 401 wrong_pin \
            -X POST "$WORKER_URL/v1/verify-pin" \
            -H 'Content-Type: application/json' -H "$AUTH" \
            --data "{\"deviceId\":\"$DEVICE\",\"guardianProof\":\"$WRONG_PROOF\"}"

          request verify_pin \
            -X POST "$WORKER_URL/v1/verify-pin" \
            -H 'Content-Type: application/json' -H "$AUTH" \
            --data "{\"deviceId\":\"$DEVICE\",\"guardianProof\":\"$PROOF\"}"

          request unlock \
            -X POST "$WORKER_URL/v1/unlock" \
            -H 'Content-Type: application/json' -H "$AUTH" \
            -H "X-Guardian-Proof: $PROOF" \
            --data "{\"deviceId\":\"$DEVICE\",\"action\":\"allow_app_installs_15\"}"

          request command \
            "$WORKER_URL/v1/command?deviceId=$DEVICE" -H "$AUTH"

          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/command.json","utf8"));
            if(c.action!=="allow_app_installs_15" || c.minutes!==15 || !c.id) process.exit(1);
            fs.writeFileSync(process.env.RUNNER_TEMP+"/command-id.txt", c.id);
          '

          COMMAND_ID=$(cat "$RUNNER_TEMP/command-id.txt")
          request ack \
            -X POST "$WORKER_URL/v1/ack" \
            -H 'Content-Type: application/json' -H "$AUTH" \
            --data "{\"deviceId\":\"$DEVICE\",\"id\":\"$COMMAND_ID\"}"

          request revoke \
            -X POST "$WORKER_URL/v1/revoke" \
            -H 'Content-Type: application/json' -H "$AUTH" \
            --data "{\"deviceId\":\"$DEVICE\"}"

          echo "Guardian PIN gate, wrong-PIN rejection, app-install command, polling, acknowledgement and revoke all passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload claim details securely
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-temporary-claim
          path: ${{ runner.temp }}/cloudflare-claim.txt
          if-no-files-found: warn
          retention-days: 1
